<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='88' font-size='96'%3E%E2%98%91%EF%B8%8F%3C/text%3E%3C/svg%3E" type="image/svg+xml" />
    <title>habitracker</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.29.1/index.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <div>
          <h1 id="title">Today</h1>
          <div class="sub" id="sub"></div>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">☀ Light</button>
      </header>
      <main id="main"></main>
      <nav id="nav">
        <button data-v="day">Day</button>
        <button data-v="cal">Calendar</button>
        <button data-v="habits">Habits</button>
      </nav>
    </div>

    <div id="login">
      <h1>habitracker</h1>
      <div class="sub" id="lmsg">Track daily habits. Share routines.</div>
      <button class="btn" id="gbtn">Sign in with Google</button>
    </div>

    <div class="toast" id="toast"></div>
    <div id="modal"><div class="sheet" id="sheet"></div></div>

    <script>
      var firebaseConfig = {
        apiKey: "AIzaSyCiykoWs7zgleN79X52RmW0NM7lW1bNnWc",
        authDomain: "nginx403-habitracker.firebaseapp.com",
        projectId: "nginx403-habitracker",
        appId: "1:691926413051:web:029968488bb8cf4b3f0a5e"
      };

      (function () {
        var S = { habits: [], logs: {}, inbox: [], sharedDone: {}, ownerSharedDone: {} },
          uid = null,
          me = { name: "", email: "" },
          auth,
          fs,
          unsubs = [];

        function applyTheme(theme) {
          var next = theme === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = next;
          var toggle = $("themeToggle");
          if (toggle) {
            toggle.textContent = next === "dark" ? "☀" : "☽";
            toggle.setAttribute("aria-label", next === "dark" ? "Switch to light mode" : "Switch to dark mode");
          }
          try {
            localStorage.setItem("habit-theme", next);
          } catch (e) {}
        }

        function initTheme() {
          var saved = null;
          try {
            saved = localStorage.getItem("habit-theme");
          } catch (e) {}
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          applyTheme(saved || (prefersDark ? "dark" : "light"));
        }

        function ds(d) {
          return (
            d.getFullYear() +
            "-" +
            String(d.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(d.getDate()).padStart(2, "0")
          );
        }

        function pd(s) {
          var p = s.split("-");
          return new Date(+p[0], +p[1] - 1, +p[2]);
        }

        function addDays(s, n) {
          var d = pd(s);
          d.setDate(d.getDate() + n);
          return ds(d);
        }

        function esc(t) {
          return String(t).replace(/[&<>\"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }

        var $ = function (i) {
          return document.getElementById(i);
        };

        var TODAY = ds(new Date()),
          view = "day",
          cur = TODAY,
          mon = pd(TODAY);
        mon.setDate(1);

        var tt;
        function toast(m) {
          var t = $("toast");
          t.textContent = m;
          t.style.display = "block";
          clearTimeout(tt);
          tt = setTimeout(function () {
            t.style.display = "none";
          }, 3500);
        }

        function fail() {
          toast("Could not save. Check your connection.");
        }

        function nid() {
          return "h" + Date.now() + Math.random().toString(36).slice(2, 6);
        }

        function saveHabits() {
          fs.doc("users/" + uid + "/data/habits")
            .set({ list: S.habits })
            .catch(fail);
        }

        function saveLogs(years) {
          years.forEach(function (y) {
            var days = {};
            Object.keys(S.logs).forEach(function (k) {
              if (k.indexOf(y) === 0) days[k] = S.logs[k];
            });
            fs.doc("users/" + uid + "/data/logs_" + y)
              .set({ days: days })
              .catch(fail);
          });
        }

        function active(h, d) {
          return d >= h.start && (!h.end || d <= h.end);
        }

        function list(d) {
          return S.habits.filter(function (h) {
            return active(h, d);
          });
        }

        function isDone(d, id) {
          var habit = S.habits.filter(function (h) {
            return h.id === id;
          })[0];
          if (habit && habit.sharedId && S.sharedDone[habit.sharedId]) {
            return S.sharedDone[habit.sharedId].indexOf(d) > -1;
          }
          if (habit && S.ownerSharedDone[id]) {
            return S.ownerSharedDone[id].indexOf(d) > -1;
          }
          return (S.logs[d] || []).indexOf(id) > -1;
        }

        function syncSharedCompletion(id, d, done) {
          fs.collection("shares").where("fromUid", "==", uid).get().then(function (qs) {
            var updates = [];
            qs.forEach(function (doc) {
              if (doc.data().habitId !== id) return;
              updates.push(doc.ref.update({
                doneDays: done
                  ? firebase.firestore.FieldValue.arrayUnion(d)
                  : firebase.firestore.FieldValue.arrayRemove(d)
              }));
            });
            return Promise.all(updates);
          }).catch(fail);
        }

        function toggle(d, id) {
          var habit = S.habits.filter(function (h) {
              return h.id === id;
            })[0],
            wasDone = isDone(d, id),
            done = !wasDone;

          if (habit && habit.sharedId) {
            var sharedDays = (S.sharedDone[habit.sharedId] || []).slice(),
              sharedIndex = sharedDays.indexOf(d);
            if (done && sharedIndex === -1) sharedDays.push(d);
            if (!done && sharedIndex > -1) sharedDays.splice(sharedIndex, 1);
            S.sharedDone[habit.sharedId] = sharedDays;
            fs.doc("shares/" + habit.sharedId).update({
              doneDays: done
                ? firebase.firestore.FieldValue.arrayUnion(d)
                : firebase.firestore.FieldValue.arrayRemove(d)
            }).catch(fail);
            render();
            return;
          }

          var l = (S.logs[d] || []).slice(),
            i = l.indexOf(id);
          if (i > -1) l.splice(i, 1);
          else l.push(id);
          S.logs[d] = l;
          if (habit && S.ownerSharedDone[id]) {
            var sharedDays = S.ownerSharedDone[id].slice(),
              sharedIndex = sharedDays.indexOf(d);
            if (done && sharedIndex === -1) sharedDays.push(d);
            if (!done && sharedIndex > -1) sharedDays.splice(sharedIndex, 1);
            S.ownerSharedDone[id] = sharedDays;
          }
          saveLogs([d.slice(0, 4)]);
          syncSharedCompletion(id, d, done);
          render();
        }

        function status(d) {
          var l = list(d);
          if (!l.length) return "none";
          if (l.every(function (h) {
            return isDone(d, h.id);
          })) return "g";
          return d < TODAY ? "r" : "pending";
        }

        function fmt(s, o) {
          return pd(s).toLocaleDateString(undefined, o);
        }

        function render() {
          var m = $("main"), h = "";
          Array.prototype.forEach.call($("nav").children, function (b) {
            b.className = b.dataset.v === view ? "on" : "";
          });

          if (view === "day") {
            $("title").textContent = cur === TODAY ? "Today" : fmt(cur, { weekday: "long" });
            $("sub").textContent = fmt(cur, { month: "long", day: "numeric", year: "numeric" });
            var l = list(cur), n = l.filter(function (x) {
              return isDone(cur, x.id);
            }).length;

            h += '<div class="datebar"><button data-a="prev" aria-label="Previous day">&lsaquo;</button><div>' +
              (cur === TODAY ? "" : '<button class="btn ghost" data-a="today" style="width:auto;font-size:14px;padding:0 12px">Back to today</button>') +
              '</div><button data-a="next" aria-label="Next day">&rsaquo;</button></div>';

            if (l.length) {
              h += '<div class="bar"><i style="width:' + (n / l.length * 100) + '%"></i></div>';
              l.forEach(function (x) {
                var d = isDone(cur, x.id);
                h += '<button class="item' + (d ? " done" : "") + '" data-t="' + x.id + '"><span class="box">' + (d ? "✓" : "") + '</span>' + (x.emoji ? '<span class="habit-mark" aria-hidden="true">' + esc(x.emoji) + '</span>' : '') + '<span class="nm">' + esc(x.name) + '</span></button>';
              });
              h += '<div class="sub" style="margin-top:8px">' + n + ' of ' + l.length + ' done</div>';
            } else {
              h += '<div class="empty">No habits on this day.<br>Add one in the Habits tab.</div>';
            }
          } else if (view === "cal") {
            $("title").textContent = "Calendar";
            $("sub").textContent = "";

            var y = mon.getFullYear(),
              mo = mon.getMonth(),
              first = new Date(y, mo, 1).getDay(),
              dim = new Date(y, mo + 1, 0).getDate();

            h += '<div class="mh"><button data-a="pm" aria-label="Previous month">&lsaquo;</button><b>' +
              mon.toLocaleDateString(undefined, { month: "long", year: "numeric" }) +
              '</b><button data-a="nm" aria-label="Next month">&rsaquo;</button></div><div class="grid">';

            ["S", "M", "T", "W", "T", "F", "S"].forEach(function (x) {
              h += '<div class="dow">' + x + '</div>';
            });

            for (var i = 0; i < first; i++) h += '<div class="cell blank"></div>';

            for (var d = 1; d <= dim; d++) {
              var k = ds(new Date(y, mo, d)), st = status(k);
              h += '<button class="cell ' + (st === "g" || st === "r" ? st : "none") + (k === TODAY ? " today" : "") + '" data-d="' + k + '">' + d + '</button>';
            }

            h += '</div><div class="legend"><span style="--c:var(--green)">All done</span><span style="--c:var(--red)">Missed</span></div>';
          } else {
            $("title").textContent = "Habits";
            $("sub").textContent = me.email;

            if (S.inbox.length) {
              h += '<div class="inbox"><h3>Shared with you</h3>';
              S.inbox.forEach(function (x) {
                h += '<div class="r"><span><b>' + (x.emoji ? esc(x.emoji) + ' ' : '') + esc(x.name) + '</b><br><small class="sub">from ' + esc(x.fromName || "someone") + '</small></span><button class="btn" data-acc="' + x.id + '">Add</button><button class="btn ghost" data-dec="' + x.id + '">Skip</button></div>';
              });
              h += '</div>';
            }

            h += '<div class="row" style="margin-bottom:16px"><button class="btn" style="flex:1" data-a="add">+ New habit</button>' +
              (S.habits.length ? '<button class="btn ghost" data-a="shareall">Share all</button>' : '') +
              '</div>';

            if (!S.habits.length) h += '<div class="empty">Nothing yet. Add your first habit.</div>';

            S.habits.forEach(function (x, index) {
              var off = x.end && x.end < TODAY;
              h += '<div class="hab' + (off ? " off" : "") + '" data-habit-id="' + x.id + '"><div class="hab-heading"><button type="button" class="drag-handle" data-drag-id="' + x.id + '" aria-label="Drag to reorder ' + esc(x.name) + '" title="Drag to reorder">⋮⋮</button><button type="button" class="hab-title" data-e="' + x.id + '"><span class="habit-mark" aria-hidden="true">' + esc(x.emoji || "") + '</span><span class="hab-name">' + esc(x.name) + '</span></button></div><div class="hab-meta"><small>' + (off ? "Ended " : "Daily · ") + (x.end ? "until " + fmt(x.end, { month: "short", day: "numeric", year: "numeric" }) : "until stopped") + '</small><span class="hab-actions"><button type="button" class="hab-action icon-action" data-share="' + x.id + '" aria-label="Share habit" title="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.7 10.5 6.6-4"></path><path d="m8.7 13.5 6.6 4"></path></svg></button><button type="button" class="hab-action danger icon-action" data-delete="' + x.id + '" aria-label="Delete habit" title="Delete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18"></path><path d="M8 4V3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v1"></path><path d="m19 4-1 16.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 6 20.5L5 4"></path><path d="M10 10v8"></path><path d="M14 10v8"></path></svg></button></span></div></div>';
            });

            h += '<button class="btn ghost" style="width:100%;margin-top:16px" data-a="out">Sign out</button>';
          }

          m.innerHTML = h;
        }

        function openShare(hs) {
          var s = $("sheet");
          s.innerHTML = '<h2>Share ' + (hs.length > 1 ? "all habits" : esc(hs[0].name)) + '</h2><label for="se">Their Google email</label><input type="text" id="se" placeholder="username@gmail.com" autocapitalize="off" autocomplete="off"><div class="acts"><button class="btn ghost" data-x="cancel">Cancel</button><button class="btn" data-x="send">Send</button></div>';
          $("modal").classList.add("show");

          s.onclick = function (e) {
            var b = e.target.closest("button");
            if (!b) return;
            if (b.dataset.x === "cancel") return close();
            if (b.dataset.x === "send") {
              var to = $("se").value.trim().toLowerCase();
              if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) {
                toast("Enter a valid email.");
                return;
              }
              if (to === me.email.toLowerCase()) {
                toast("That is your own email.");
                return;
              }

              Promise.all(hs.map(function (h) {
                return fs.collection("shares").add({
                  fromUid: uid,
                  fromName: me.name || me.email,
                  toEmail: to,
                  habitId: h.id,
                  name: h.name,
                  emoji: h.emoji || "",
                  start: h.start,
                  end: h.end || null,
                  doneDays: Object.keys(S.logs).filter(function (day) {
                    return (S.logs[day] || []).indexOf(h.id) > -1;
                  }),
                  at: Date.now()
                });
              }))
                .then(function () {
                  toast("Sent to " + to);
                  close();
                })
                .catch(function () {
                  toast("Could not share.");
                });
            }
          };
        }

        function edit(id) {
          var x = Object.assign({}, S.habits.filter(function (a) {
              return a.id === id;
            })[0] || { name: "", start: TODAY, end: null, emoji: "" }),
            mode = x.end ? "date" : "never",
            dateEnd = x.end || addDays(x.start, 30),
            s = $("sheet");

          function draw() {
            s.innerHTML =
              '<div class="sheet-heading"><h2>' + (id ? "Edit habit" : "New habit") + '</h2><button type="button" class="emoji-trigger" id="emojiToggle" aria-label="Choose habit emoji" aria-expanded="false" title="Choose emoji">' + esc(x.emoji || "☺") + '</button></div>' +
              '<div class="emoji-popover" id="emojiPopover" hidden><emoji-picker></emoji-picker><button type="button" class="emoji-clear" data-clear-emoji>No emoji</button></div>' +
              '<label for="hn">Name</label><input type="text" id="hn" maxlength="60" autocomplete="off" value="' + esc(x.name) + '" placeholder="e.g. Read 20 pages">' +
              '<label for="hs">Starts</label><input type="date" id="hs" value="' + x.start + '">' +
              '<label>Repeats daily</label><div class="opt"><button data-m="never" class="' + (mode === "never" ? "on" : "") + '">Until I stop it</button><button data-m="date" class="' + (mode === "date" ? "on" : "") + '">Until a date</button></div>' +
              (mode === "date" ? '<input type="date" id="he" value="' + dateEnd + '">' : "") +
              '<div class="acts"><button class="btn ghost" data-x="cancel">Cancel</button><button class="btn" data-x="save">Save</button></div>';
            s.querySelector("emoji-picker").addEventListener("emoji-click", function (e) {
              x.emoji = e.detail.unicode;
              $("emojiToggle").textContent = x.emoji;
              $("emojiPopover").hidden = true;
              $("emojiToggle").setAttribute("aria-expanded", "false");
            });
          }

          draw();
          $("modal").classList.add("show");

          s.onclick = function (e) {
            var b = e.target.closest("button");
            if (!b) return;

            if (b.id === "emojiToggle") {
              var popover = $("emojiPopover");
              popover.hidden = !popover.hidden;
              b.setAttribute("aria-expanded", String(!popover.hidden));
              return;
            }

            if (b.hasAttribute("data-clear-emoji")) {
              x.emoji = "";
              $("emojiToggle").textContent = "☺";
              $("emojiPopover").hidden = true;
              $("emojiToggle").setAttribute("aria-expanded", "false");
              return;
            }

            if (b.dataset.m) {
              x.name = $("hn").value;
              x.start = $("hs").value || x.start;
              if ($("he")) dateEnd = $("he").value || dateEnd;
              mode = b.dataset.m;
              if (mode === "never") x.end = null;
              else {
                if (dateEnd < x.start) dateEnd = addDays(x.start, 30);
                x.end = dateEnd;
              }
              draw();
              return;
            }

            var a = b.dataset.x,
              t = S.habits.filter(function (q) {
                return q.id === id;
              })[0];

            if (a === "cancel") close();
            if (a === "save") {
              var nm = $("hn").value.trim();
              if (!nm) {
                $("hn").focus();
                return;
              }
              var st = $("hs").value || TODAY,
                en = mode === "date" && $("he") ? $("he").value : null;

              if (en && en < st) {
                alert("End date must be after the start date.");
                return;
              }

              if (t) {
                t.name = nm;
                t.emoji = x.emoji;
                t.start = st;
                t.end = en;
              } else {
                S.habits.push({ id: nid(), name: nm, emoji: x.emoji, start: st, end: en });
              }

              saveHabits();
              close();
              render();
            }

            if (a === "stop") {
              t.end = TODAY < t.start ? t.start : TODAY;
              saveHabits();
              close();
              render();
            }

          };
        }

        function deleteHabit(id) {
          var habit = S.habits.filter(function (item) {
            return item.id === id;
          })[0];
          if (!habit || !confirm("Delete this habit and its history?")) return;

          S.habits = S.habits.filter(function (item) {
            return item.id !== id;
          });
          var years = {};
          Object.keys(S.logs).forEach(function (day) {
            years[day.slice(0, 4)] = 1;
            S.logs[day] = S.logs[day].filter(function (habitId) {
              return habitId !== id;
            });
          });
          saveHabits();
          saveLogs(Object.keys(years));
          render();
        }

        function persistHabitOrder() {
          var orderedIds = Array.prototype.map.call($("main").querySelectorAll(".hab"), function (row) {
            return row.dataset.habitId;
          });
          var reordered = orderedIds.map(function (id) {
            return S.habits.filter(function (habit) {
              return habit.id === id;
            })[0];
          }).filter(Boolean);
          if (reordered.length !== S.habits.length) return;
          if (reordered.every(function (habit, index) {
            return habit.id === S.habits[index].id;
          })) return;
          S.habits = reordered;
          saveHabits();
          render();
        }

        function moveHabitByKeyboard(id, direction) {
          var from = S.habits.findIndex(function (habit) {
              return habit.id === id;
            }),
            to = from + direction;
          if (from < 0 || to < 0 || to >= S.habits.length) return;
          var moved = S.habits.splice(from, 1)[0];
          S.habits.splice(to, 0, moved);
          saveHabits();
          render();
          var handle = Array.prototype.filter.call(document.querySelectorAll("[data-drag-id]"), function (item) {
            return item.dataset.dragId === id;
          })[0];
          if (handle) handle.focus();
        }

        function close() {
          $("modal").classList.remove("show");
        }

        $("modal").addEventListener("click", function (e) {
          if (e.target.id === "modal") close();
        });

        document.addEventListener("click", function (e) {
          var n = e.target.closest("#nav button");
          if (n) {
            view = n.dataset.v;
            render();
            return;
          }

          var b = e.target.closest("#main button");
          if (!b) return;

          var a = b.dataset.a;

          if (b.dataset.t) toggle(cur, b.dataset.t);
          else if (b.dataset.d) {
            cur = b.dataset.d;
            view = "day";
            render();
          } else if (b.dataset.share) {
            var habitToShare = S.habits.filter(function (habit) {
              return habit.id === b.dataset.share;
            })[0];
            if (habitToShare) openShare([habitToShare]);
          } else if (b.dataset.delete) deleteHabit(b.dataset.delete);
          else if (b.dataset.e) edit(b.dataset.e);
          else if (b.dataset.acc) {
            var sh = S.inbox.filter(function (q) {
              return q.id === b.dataset.acc;
            })[0];
            if (sh) {
              fs.doc("shares/" + sh.id).update({ acceptedByUid: uid, acceptedAt: Date.now() }).then(function () {
                S.habits.push({
                  id: nid(),
                  sharedId: sh.id,
                  name: sh.name,
                  emoji: sh.emoji || "",
                  start: TODAY,
                  end: sh.end && sh.end >= TODAY ? sh.end : null
                });
                saveHabits();
                render();
                toast("Added to your habits");
              }).catch(fail);
            }
          } else if (b.dataset.dec) fs.doc("shares/" + b.dataset.dec).delete();
          else if (a === "add") edit(null);
          else if (a === "shareall") openShare(S.habits.filter(function (h) {
            return !h.end || h.end >= TODAY;
          }));
          else if (a === "out") auth.signOut();
          else if (a === "prev") {
            cur = addDays(cur, -1);
            render();
          } else if (a === "next") {
            cur = addDays(cur, 1);
            render();
          } else if (a === "today") {
            cur = TODAY;
            render();
          } else if (a === "pm") {
            mon.setMonth(mon.getMonth() - 1);
            render();
          } else if (a === "nm") {
            mon.setMonth(mon.getMonth() + 1);
            render();
          }
        });

        var activePointerDrag = null;

        $("main").addEventListener("pointerdown", function (e) {
          var handle = e.target.closest("[data-drag-id]");
          if (!handle || (e.button !== undefined && e.button !== 0)) return;
          activePointerDrag = {
            id: handle.dataset.dragId,
            pointerId: e.pointerId,
            startX: e.clientX,
            startY: e.clientY,
            moved: false,
            row: handle.closest(".hab")
          };
          handle.setPointerCapture(e.pointerId);
        });

        $("main").addEventListener("pointermove", function (e) {
          if (!activePointerDrag || activePointerDrag.pointerId !== e.pointerId) return;
          if (!activePointerDrag.moved && Math.hypot(e.clientX - activePointerDrag.startX, e.clientY - activePointerDrag.startY) < 5) return;
          activePointerDrag.moved = true;
          e.preventDefault();
          var target = document.elementFromPoint(e.clientX, e.clientY),
            targetRow = target && target.closest(".hab"),
            draggedRow = activePointerDrag.row;
          if (!targetRow || targetRow === draggedRow) return;
          var rect = targetRow.getBoundingClientRect(),
            insertBefore = e.clientY < rect.top + rect.height / 2,
            reference = insertBefore ? targetRow : targetRow.nextElementSibling;
          if (reference !== draggedRow) $("main").insertBefore(draggedRow, reference);
        });

        $("main").addEventListener("pointerup", function (e) {
          if (!activePointerDrag || activePointerDrag.pointerId !== e.pointerId) return;
          var moved = activePointerDrag.moved;
          activePointerDrag.row.classList.remove("dragging");
          activePointerDrag = null;
          if (moved) persistHabitOrder();
        });

        $("main").addEventListener("pointercancel", function (e) {
          if (!activePointerDrag || activePointerDrag.pointerId !== e.pointerId) return;
          activePointerDrag = null;
          render();
        });

        $("main").addEventListener("keydown", function (e) {
          var handle = e.target.closest("[data-drag-id]");
          if (!handle || !e.altKey || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
          e.preventDefault();
          moveHabitByKeyboard(handle.dataset.dragId, e.key === "ArrowUp" ? -1 : 1);
        });

        $("themeToggle").addEventListener("click", function () {
          var current = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
          applyTheme(current === "dark" ? "light" : "dark");
        });

        initTheme();

        function stop() {
          unsubs.forEach(function (u) {
            u();
          });
          unsubs = [];
        }

        if (firebaseConfig.apiKey.indexOf("PASTE") === 0) {
          $("login").style.display = "flex";
          $("lmsg").textContent = "Setup needed: paste your Firebase config at the top of index.html.";
          $("gbtn").style.display = "none";
          return;
        }

        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        fs = firebase.firestore();
        fs.enablePersistence({ synchronizeTabs: true }).catch(function () {});

        function signInErrorMessage(error) {
          if (error.code === "auth/operation-not-supported-in-this-environment") {
            return "Open the HTTPS hosted app or use localhost. Google sign-in does not work from a file:// page.";
          }
          if (error.code === "auth/unauthorized-domain") {
            return "This domain is not authorized for Google sign-in. Add it in Firebase Authentication settings.";
          }
          return "Sign-in failed: " + (error.message || error.code || "Please try again.");
        }

        $("gbtn").onclick = function () {
          var p = new firebase.auth.GoogleAuthProvider();
          var button = $("gbtn");
          var message = $("lmsg");
          button.disabled = true;
          message.textContent = "Signing in...";

          function showSignInError(error) {
            button.disabled = false;
            message.textContent = signInErrorMessage(error);
          }

          auth.signInWithPopup(p).catch(function () {
            return auth.signInWithRedirect(p).catch(showSignInError);
          });
        };

        auth.getRedirectResult().catch(function (error) {
          $("gbtn").disabled = false;
          $("lmsg").textContent = signInErrorMessage(error);
        });

        auth.onAuthStateChanged(function (u) {
          stop();

          if (!u) {
            uid = null;
            S = { habits: [], logs: {}, inbox: [], sharedDone: {}, ownerSharedDone: {} };
            $("login").style.display = "flex";
            return;
          }

          uid = u.uid;
          me = { name: u.displayName || "", email: u.email || "" };
          $("login").style.display = "none";
          render();

          unsubs.push(
            fs.collection("users/" + uid + "/data").onSnapshot(
              function (qs) {
                var hb = [], lg = {};
                qs.forEach(function (d) {
                  var v = d.data() || {};
                  if (d.id === "habits") hb = v.list || [];
                  else if (d.id.indexOf("logs_") === 0) Object.assign(lg, v.days || {});
                });
                S.habits = hb;
                S.logs = lg;
                render();
              },
              function () {
                toast("Sync error. Reload the page.");
              }
            )
          );

          unsubs.push(
            fs.collection("shares")
              .where("fromUid", "==", uid)
              .onSnapshot(
                function (qs) {
                  var shared = {};
                  qs.forEach(function (doc) {
                    var v = doc.data() || {};
                    shared[v.habitId] = v.doneDays || [];
                  });
                  S.ownerSharedDone = shared;
                  render();
                },
                function () {
                  toast("Sync error. Reload the page.");
                }
              )
          );

          unsubs.push(
            fs.collection("shares")
              .where("toEmail", "==", me.email.toLowerCase())
              .onSnapshot(
                function (qs) {
                  S.inbox = qs.docs.map(function (d) {
                    var v = d.data();
                    v.id = d.id;
                    return v;
                  }).filter(function (v) {
                    if (v.acceptedByUid === uid) {
                      S.sharedDone[v.id] = v.doneDays || [];
                      return false;
                    }
                    return true;
                  });
                  render();
                },
                function () {}
              )
          );
        });
      })();
    </script>
  </body>
</html>
