<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Ctext y='88' font-size='96'%3E%E2%98%91%EF%B8%8F%3C/text%3E%3C/svg%3E" type="image/svg+xml" />
    <title>habitracker</title>
    <style>
      :root{--bg:#fff;--fg:#252525;--mute:#8a8a8a;--line:#e3e3e3;--soft:#f6f6f6;--green:#2fae66;--red:#e5533d;
      box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
      @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#252525;--fg:#f2f2f2;--mute:#8d8d8d;--line:#2a2a2a;--soft:#171717;color-scheme:dark}}
      :root[data-theme="dark"]{--bg:#252525;--fg:#f2f2f2;--mute:#8d8d8d;--line:#2a2a2a;--soft:#171717;color-scheme:dark}
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{height:100%;margin:0}
      body{background:var(--bg);color:var(--fg);font:16px/1.4 "Helvetica Neue",Helvetica,Arial,sans-serif}
      #app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
      header{padding:22px 20px 12px;display:flex;justify-content:space-between;align-items:flex-end}
      h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px}
      .theme-toggle{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:18px;line-height:1}
      .sub{color:var(--mute);font-size:13px}
      main{flex:1;overflow-y:auto;padding:8px 20px 16px}
      nav{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
      nav button{flex:1;padding:12px 0;background:transparent;color:var(--mute);border:0;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
      nav button.on{background:var(--soft);color:var(--fg)}
      button{font:inherit;color:var(--fg)}
      .btn{background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer}
      .btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
      .btn.danger{background:transparent;color:var(--red);border-color:var(--line)}
      .row{display:flex;gap:8px;align-items:center}
      .datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
      .datebar button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:20px;cursor:pointer}
      .datebar div{text-align:center;font-weight:600}
      .bar{height:6px;background:var(--soft);border-radius:99px;margin-bottom:16px;overflow:hidden}
      .bar i{display:block;height:100%;background:var(--fg);border-radius:99px;transition:width .25s}
      .item{display:flex;align-items:center;gap:14px;width:100%;padding:16px;margin-bottom:8px;border:1px solid var(--line);border-radius:16px;background:var(--bg);text-align:left;cursor:pointer;transition:background .15s}
      .box{width:26px;height:26px;border:1.5px solid var(--mute);border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;transition:all .15s}
      .item.done{background:var(--soft)}
      .item.done .box{background:var(--fg);border-color:var(--fg);color:var(--bg)}
      .item.done .nm{color:var(--mute);text-decoration:line-through}
      .item .nm{flex:1;font-weight:500}
      .empty{color:var(--mute);padding:32px 0;text-align:center}
      .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
      .mh button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:20px;cursor:pointer}
      .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
      .dow{text-align:center;color:var(--mute);font-size:12px;padding-bottom:4px}
      .cell{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:transparent;font-weight:600;cursor:pointer;padding:0}
      .cell.blank{border:0;cursor:default}
      .cell.none{color:var(--mute);font-weight:400}
      .cell.g{background:var(--green);border-color:var(--green);color:#fff}
      .cell.r{background:var(--red);border-color:var(--red);color:#fff}
      .cell.today{outline:2px solid var(--fg);outline-offset:1px}
      .legend{display:flex;gap:16px;margin-top:16px;font-size:13px;color:var(--mute)}
      .legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;background:var(--c);border-radius:4px;vertical-align:-1px}
      .hab{display:block;width:100%;text-align:left;padding:16px;margin-bottom:8px;border:1px solid var(--line);border-radius:16px;background:var(--bg);cursor:pointer}
      .hab.off{color:var(--mute)}
      .hab b{display:block;font-weight:600}
      .hab small{color:var(--mute)}
      .add{width:100%;margin-bottom:16px}
      #modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
      #modal.show{display:flex}
      .sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.12)}
      .sheet h2{margin:0 0 16px;font-size:20px}
      label{display:block;font-weight:600;margin:14px 0 6px;font-size:14px}
      input[type=text],input[type=date]{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit}
      input:focus{outline:none;border-color:var(--fg)}
      .opt{display:flex;margin-bottom:8px;background:var(--soft);border-radius:12px;padding:3px}
      .opt button{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--mute);font-weight:600;cursor:pointer}
      .opt button.on{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
      .acts{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
      .acts .btn{flex:1}
      .toast{position:fixed;left:20px;right:20px;bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;z-index:9;display:none;max-width:520px;margin:0 auto}
      .inbox{background:var(--soft);border-radius:16px;padding:14px;margin-bottom:16px}
      .inbox .r{display:flex;align-items:center;gap:8px;margin-top:8px}
      .inbox .r span{flex:1}
      .inbox .btn{padding:8px 12px}
      h3{margin:0 0 4px;font-size:14px}
      #login{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:24px;text-align:center;z-index:20}
      #login h1{font-size:40px}
      #login .btn{padding:14px 28px}
      @media (hover:hover){
        .theme-toggle:hover,.datebar button:hover,.mh button:hover,.cell.none:hover{background:var(--soft);border-color:var(--mute)}
        nav button:hover{background:var(--soft);color:var(--fg)}
        .btn:hover{filter:brightness(.9)}
        .item:hover,.hab:hover{background:var(--soft);border-color:var(--mute)}
        .cell.g:hover,.cell.r:hover{filter:brightness(.9)}
        .opt button:not(.on):hover{background:var(--bg);color:var(--fg)}
      }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <div>
          <h1 id="title">Today</h1>
          <div class="sub" id="sub"></div>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">☀ Light</button>
      </header>
      <main id="main"></main>
      <nav id="nav">
        <button data-v="day">Day</button>
        <button data-v="cal">Calendar</button>
        <button data-v="habits">Habits</button>
      </nav>
    </div>

    <div id="login">
      <h1>habitracker</h1>
      <div class="sub" id="lmsg">Track daily habits. Share routines.</div>
      <button class="btn" id="gbtn">Sign in with Google</button>
    </div>

    <div class="toast" id="toast"></div>
    <div id="modal"><div class="sheet" id="sheet"></div></div>

    <script>
      var firebaseConfig = {
        apiKey: "AIzaSyCiykoWs7zgleN79X52RmW0NM7lW1bNnWc",
        authDomain: "nginx403-habitracker.firebaseapp.com",
        projectId: "nginx403-habitracker",
        appId: "1:691926413051:web:029968488bb8cf4b3f0a5e"
      };

      (function () {
        var S = { habits: [], logs: {}, inbox: [], sharedDone: {}, ownerSharedDone: {} },
          uid = null,
          me = { name: "", email: "" },
          auth,
          fs,
          unsubs = [];

        function applyTheme(theme) {
          var next = theme === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = next;
          var toggle = $("themeToggle");
          if (toggle) {
            toggle.textContent = next === "dark" ? "☀" : "☽";
            toggle.setAttribute("aria-label", next === "dark" ? "Switch to light mode" : "Switch to dark mode");
          }
          try {
            localStorage.setItem("habit-theme", next);
          } catch (e) {}
        }

        function initTheme() {
          var saved = null;
          try {
            saved = localStorage.getItem("habit-theme");
          } catch (e) {}
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          applyTheme(saved || (prefersDark ? "dark" : "light"));
        }

        function ds(d) {
          return (
            d.getFullYear() +
            "-" +
            String(d.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(d.getDate()).padStart(2, "0")
          );
        }

        function pd(s) {
          var p = s.split("-");
          return new Date(+p[0], +p[1] - 1, +p[2]);
        }

        function addDays(s, n) {
          var d = pd(s);
          d.setDate(d.getDate() + n);
          return ds(d);
        }

        function esc(t) {
          return String(t).replace(/[&<>\"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }

        var $ = function (i) {
          return document.getElementById(i);
        };

        var TODAY = ds(new Date()),
          view = "day",
          cur = TODAY,
          mon = pd(TODAY);
        mon.setDate(1);

        var tt;
        function toast(m) {
          var t = $("toast");
          t.textContent = m;
          t.style.display = "block";
          clearTimeout(tt);
          tt = setTimeout(function () {
            t.style.display = "none";
          }, 3500);
        }

        function fail() {
          toast("Could not save. Check your connection.");
        }

        function nid() {
          return "h" + Date.now() + Math.random().toString(36).slice(2, 6);
        }

        function saveHabits() {
          fs.doc("users/" + uid + "/data/habits")
            .set({ list: S.habits })
            .catch(fail);
        }

        function saveLogs(years) {
          years.forEach(function (y) {
            var days = {};
            Object.keys(S.logs).forEach(function (k) {
              if (k.indexOf(y) === 0) days[k] = S.logs[k];
            });
            fs.doc("users/" + uid + "/data/logs_" + y)
              .set({ days: days })
              .catch(fail);
          });
        }

        function active(h, d) {
          return d >= h.start && (!h.end || d <= h.end);
        }

        function list(d) {
          return S.habits.filter(function (h) {
            return active(h, d);
          });
        }

        function isDone(d, id) {
          var habit = S.habits.filter(function (h) {
            return h.id === id;
          })[0];
          if (habit && habit.sharedId && S.sharedDone[habit.sharedId]) {
            return S.sharedDone[habit.sharedId].indexOf(d) > -1;
          }
          if (habit && S.ownerSharedDone[id]) {
            return S.ownerSharedDone[id].indexOf(d) > -1;
          }
          return (S.logs[d] || []).indexOf(id) > -1;
        }

        function syncSharedCompletion(id, d, done) {
          fs.collection("shares").where("fromUid", "==", uid).get().then(function (qs) {
            var updates = [];
            qs.forEach(function (doc) {
              if (doc.data().habitId !== id) return;
              updates.push(doc.ref.update({
                doneDays: done
                  ? firebase.firestore.FieldValue.arrayUnion(d)
                  : firebase.firestore.FieldValue.arrayRemove(d)
              }));
            });
            return Promise.all(updates);
          }).catch(fail);
        }

        function toggle(d, id) {
          var habit = S.habits.filter(function (h) {
              return h.id === id;
            })[0],
            wasDone = isDone(d, id),
            done = !wasDone;

          if (habit && habit.sharedId) {
            var sharedDays = (S.sharedDone[habit.sharedId] || []).slice(),
              sharedIndex = sharedDays.indexOf(d);
            if (done && sharedIndex === -1) sharedDays.push(d);
            if (!done && sharedIndex > -1) sharedDays.splice(sharedIndex, 1);
            S.sharedDone[habit.sharedId] = sharedDays;
            fs.doc("shares/" + habit.sharedId).update({
              doneDays: done
                ? firebase.firestore.FieldValue.arrayUnion(d)
                : firebase.firestore.FieldValue.arrayRemove(d)
            }).catch(fail);
            render();
            return;
          }

          var l = (S.logs[d] || []).slice(),
            i = l.indexOf(id);
          if (i > -1) l.splice(i, 1);
          else l.push(id);
          S.logs[d] = l;
          if (habit && S.ownerSharedDone[id]) {
            var sharedDays = S.ownerSharedDone[id].slice(),
              sharedIndex = sharedDays.indexOf(d);
            if (done && sharedIndex === -1) sharedDays.push(d);
            if (!done && sharedIndex > -1) sharedDays.splice(sharedIndex, 1);
            S.ownerSharedDone[id] = sharedDays;
          }
          saveLogs([d.slice(0, 4)]);
          syncSharedCompletion(id, d, done);
          render();
        }

        function status(d) {
          var l = list(d);
          if (!l.length) return "none";
          if (l.every(function (h) {
            return isDone(d, h.id);
          })) return "g";
          return d < TODAY ? "r" : "pending";
        }

        function fmt(s, o) {
          return pd(s).toLocaleDateString(undefined, o);
        }

        function render() {
          var m = $("main"), h = "";
          Array.prototype.forEach.call($("nav").children, function (b) {
            b.className = b.dataset.v === view ? "on" : "";
          });

          if (view === "day") {
            $("title").textContent = cur === TODAY ? "Today" : fmt(cur, { weekday: "long" });
            $("sub").textContent = fmt(cur, { month: "long", day: "numeric", year: "numeric" });
            var l = list(cur), n = l.filter(function (x) {
              return isDone(cur, x.id);
            }).length;

            h += '<div class="datebar"><button data-a="prev" aria-label="Previous day">&lsaquo;</button><div>' +
              (cur === TODAY ? "" : '<button class="btn ghost" data-a="today" style="width:auto;font-size:14px;padding:0 12px">Back to today</button>') +
              '</div><button data-a="next" aria-label="Next day">&rsaquo;</button></div>';

            if (l.length) {
              h += '<div class="bar"><i style="width:' + (n / l.length * 100) + '%"></i></div>';
              l.forEach(function (x) {
                var d = isDone(cur, x.id);
                h += '<button class="item' + (d ? " done" : "") + '" data-t="' + x.id + '"><span class="box">' + (d ? "✓" : "") + '</span><span class="nm">' + esc(x.name) + '</span></button>';
              });
              h += '<div class="sub" style="margin-top:8px">' + n + ' of ' + l.length + ' done</div>';
            } else {
              h += '<div class="empty">No habits on this day.<br>Add one in the Habits tab.</div>';
            }
          } else if (view === "cal") {
            $("title").textContent = "Calendar";
            $("sub").textContent = "";

            var y = mon.getFullYear(),
              mo = mon.getMonth(),
              first = new Date(y, mo, 1).getDay(),
              dim = new Date(y, mo + 1, 0).getDate();

            h += '<div class="mh"><button data-a="pm" aria-label="Previous month">&lsaquo;</button><b>' +
              mon.toLocaleDateString(undefined, { month: "long", year: "numeric" }) +
              '</b><button data-a="nm" aria-label="Next month">&rsaquo;</button></div><div class="grid">';

            ["S", "M", "T", "W", "T", "F", "S"].forEach(function (x) {
              h += '<div class="dow">' + x + '</div>';
            });

            for (var i = 0; i < first; i++) h += '<div class="cell blank"></div>';

            for (var d = 1; d <= dim; d++) {
              var k = ds(new Date(y, mo, d)), st = status(k);
              h += '<button class="cell ' + (st === "g" || st === "r" ? st : "none") + (k === TODAY ? " today" : "") + '" data-d="' + k + '">' + d + '</button>';
            }

            h += '</div><div class="legend"><span style="--c:var(--green)">All done</span><span style="--c:var(--red)">Missed</span></div>';
          } else {
            $("title").textContent = "Habits";
            $("sub").textContent = me.email;

            if (S.inbox.length) {
              h += '<div class="inbox"><h3>Shared with you</h3>';
              S.inbox.forEach(function (x) {
                h += '<div class="r"><span><b>' + esc(x.name) + '</b><br><small class="sub">from ' + esc(x.fromName || "someone") + '</small></span><button class="btn" data-acc="' + x.id + '">Add</button><button class="btn ghost" data-dec="' + x.id + '">Skip</button></div>';
              });
              h += '</div>';
            }

            h += '<div class="row" style="margin-bottom:16px"><button class="btn" style="flex:1" data-a="add">+ New habit</button>' +
              (S.habits.length ? '<button class="btn ghost" data-a="shareall">Share all</button>' : '') +
              '</div>';

            if (!S.habits.length) h += '<div class="empty">Nothing yet. Add your first habit.</div>';

            S.habits.forEach(function (x) {
              var off = x.end && x.end < TODAY;
              h += '<button class="hab' + (off ? " off" : "") + '" data-e="' + x.id + '"><b>' + esc(x.name) + '</b><small>' + (off ? "Ended " : "Daily · ") + (x.end ? "until " + fmt(x.end, { month: "short", day: "numeric", year: "numeric" }) : "until stopped") + '</small></button>';
            });

            h += '<button class="btn ghost" style="width:100%;margin-top:16px" data-a="out">Sign out</button>';
          }

          m.innerHTML = h;
        }

        function openShare(hs) {
          var s = $("sheet");
          s.innerHTML = '<h2>Share ' + (hs.length > 1 ? "all habits" : esc(hs[0].name)) + '</h2><label for="se">Their Google email</label><input type="text" id="se" placeholder="name@gmail.com" autocapitalize="off" autocomplete="off"><div class="acts"><button class="btn ghost" data-x="cancel">Cancel</button><button class="btn" data-x="send">Send</button></div>';
          $("modal").classList.add("show");

          s.onclick = function (e) {
            var b = e.target.closest("button");
            if (!b) return;
            if (b.dataset.x === "cancel") return close();
            if (b.dataset.x === "send") {
              var to = $("se").value.trim().toLowerCase();
              if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)) {
                toast("Enter a valid email.");
                return;
              }
              if (to === me.email.toLowerCase()) {
                toast("That is your own email.");
                return;
              }

              Promise.all(hs.map(function (h) {
                return fs.collection("shares").add({
                  fromUid: uid,
                  fromName: me.name || me.email,
                  toEmail: to,
                  habitId: h.id,
                  name: h.name,
                  start: h.start,
                  end: h.end || null,
                  doneDays: Object.keys(S.logs).filter(function (day) {
                    return (S.logs[day] || []).indexOf(h.id) > -1;
                  }),
                  at: Date.now()
                });
              }))
                .then(function () {
                  toast("Sent to " + to);
                  close();
                })
                .catch(function () {
                  toast("Could not share.");
                });
            }
          };
        }

        function edit(id) {
          var x = S.habits.filter(function (a) {
              return a.id === id;
            })[0] || { name: "", start: TODAY, end: null },
            mode = x.end ? "date" : "never",
            s = $("sheet");

          function draw() {
            s.innerHTML =
              '<h2>' + (id ? "Edit habit" : "New habit") + '</h2>' +
              '<label for="hn">Name</label><input type="text" id="hn" maxlength="60" autocomplete="off" value="' + esc(x.name) + '" placeholder="e.g. Read 20 pages">' +
              '<label for="hs">Starts</label><input type="date" id="hs" value="' + x.start + '">' +
              '<label>Repeats daily</label><div class="opt"><button data-m="never" class="' + (mode === "never" ? "on" : "") + '">Until I stop it</button><button data-m="date" class="' + (mode === "date" ? "on" : "") + '">Until a date</button></div>' +
              (mode === "date" ? '<input type="date" id="he" value="' + (x.end || addDays(TODAY, 30)) + '">' : "") +
              '<div class="acts"><button class="btn ghost" data-x="cancel">Cancel</button><button class="btn" data-x="save">Save</button>' +
              (id ? '<button class="btn ghost" data-x="stop">Stop after today</button><button class="btn ghost" data-x="share">Share</button><button class="btn danger" data-x="del">Delete</button>' : "") +
              '</div>';
          }

          draw();
          $("modal").classList.add("show");

          s.onclick = function (e) {
            var b = e.target.closest("button");
            if (!b) return;

            if (b.dataset.m) {
              x.name = $("hn").value;
              x.start = $("hs").value || x.start;
              if ($("he")) x.end = $("he").value;
              mode = b.dataset.m;
              if (mode === "never") x.end = null;
              draw();
              return;
            }

            var a = b.dataset.x,
              t = S.habits.filter(function (q) {
                return q.id === id;
              })[0];

            if (a === "cancel") close();
            if (a === "share") openShare([t]);
            if (a === "save") {
              var nm = $("hn").value.trim();
              if (!nm) {
                $("hn").focus();
                return;
              }
              var st = $("hs").value || TODAY,
                en = mode === "date" && $("he") ? $("he").value : null;

              if (en && en < st) {
                alert("End date must be after the start date.");
                return;
              }

              if (t) {
                t.name = nm;
                t.start = st;
                t.end = en;
              } else {
                S.habits.push({ id: nid(), name: nm, start: st, end: en });
              }

              saveHabits();
              close();
              render();
            }

            if (a === "stop") {
              t.end = TODAY < t.start ? t.start : TODAY;
              saveHabits();
              close();
              render();
            }

            if (a === "del" && confirm("Delete this habit and its history?")) {
              S.habits = S.habits.filter(function (q) {
                return q.id !== id;
              });
              var yrs = {};
              Object.keys(S.logs).forEach(function (k) {
                yrs[k.slice(0, 4)] = 1;
                S.logs[k] = S.logs[k].filter(function (i) {
                  return i !== id;
                });
              });
              saveHabits();
              saveLogs(Object.keys(yrs));
              close();
              render();
            }
          };
        }

        function close() {
          $("modal").classList.remove("show");
        }

        $("modal").addEventListener("click", function (e) {
          if (e.target.id === "modal") close();
        });

        document.addEventListener("click", function (e) {
          var n = e.target.closest("#nav button");
          if (n) {
            view = n.dataset.v;
            render();
            return;
          }

          var b = e.target.closest("#main button");
          if (!b) return;

          var a = b.dataset.a;

          if (b.dataset.t) toggle(cur, b.dataset.t);
          else if (b.dataset.d) {
            cur = b.dataset.d;
            view = "day";
            render();
          } else if (b.dataset.e) edit(b.dataset.e);
          else if (b.dataset.acc) {
            var sh = S.inbox.filter(function (q) {
              return q.id === b.dataset.acc;
            })[0];
            if (sh) {
              fs.doc("shares/" + sh.id).update({ acceptedByUid: uid, acceptedAt: Date.now() }).then(function () {
                S.habits.push({
                  id: nid(),
                  sharedId: sh.id,
                  name: sh.name,
                  start: TODAY,
                  end: sh.end && sh.end >= TODAY ? sh.end : null
                });
                saveHabits();
                render();
                toast("Added to your habits");
              }).catch(fail);
            }
          } else if (b.dataset.dec) fs.doc("shares/" + b.dataset.dec).delete();
          else if (a === "add") edit(null);
          else if (a === "shareall") openShare(S.habits.filter(function (h) {
            return !h.end || h.end >= TODAY;
          }));
          else if (a === "out") auth.signOut();
          else if (a === "prev") {
            cur = addDays(cur, -1);
            render();
          } else if (a === "next") {
            cur = addDays(cur, 1);
            render();
          } else if (a === "today") {
            cur = TODAY;
            render();
          } else if (a === "pm") {
            mon.setMonth(mon.getMonth() - 1);
            render();
          } else if (a === "nm") {
            mon.setMonth(mon.getMonth() + 1);
            render();
          }
        });

        $("themeToggle").addEventListener("click", function () {
          var current = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
          applyTheme(current === "dark" ? "light" : "dark");
        });

        initTheme();

        function stop() {
          unsubs.forEach(function (u) {
            u();
          });
          unsubs = [];
        }

        if (firebaseConfig.apiKey.indexOf("PASTE") === 0) {
          $("login").style.display = "flex";
          $("lmsg").textContent = "Setup needed: paste your Firebase config at the top of index.html.";
          $("gbtn").style.display = "none";
          return;
        }

        firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        fs = firebase.firestore();
        fs.enablePersistence({ synchronizeTabs: true }).catch(function () {});

        function signInErrorMessage(error) {
          if (error.code === "auth/operation-not-supported-in-this-environment") {
            return "Open the HTTPS hosted app or use localhost. Google sign-in does not work from a file:// page.";
          }
          if (error.code === "auth/unauthorized-domain") {
            return "This domain is not authorized for Google sign-in. Add it in Firebase Authentication settings.";
          }
          return "Sign-in failed: " + (error.message || error.code || "Please try again.");
        }

        $("gbtn").onclick = function () {
          var p = new firebase.auth.GoogleAuthProvider();
          var button = $("gbtn");
          var message = $("lmsg");
          button.disabled = true;
          message.textContent = "Signing in...";

          function showSignInError(error) {
            button.disabled = false;
            message.textContent = signInErrorMessage(error);
          }

          auth.signInWithPopup(p).catch(function () {
            return auth.signInWithRedirect(p).catch(showSignInError);
          });
        };

        auth.getRedirectResult().catch(function (error) {
          $("gbtn").disabled = false;
          $("lmsg").textContent = signInErrorMessage(error);
        });

        auth.onAuthStateChanged(function (u) {
          stop();

          if (!u) {
            uid = null;
            S = { habits: [], logs: {}, inbox: [], sharedDone: {}, ownerSharedDone: {} };
            $("login").style.display = "flex";
            return;
          }

          uid = u.uid;
          me = { name: u.displayName || "", email: u.email || "" };
          $("login").style.display = "none";
          render();

          unsubs.push(
            fs.collection("users/" + uid + "/data").onSnapshot(
              function (qs) {
                var hb = [], lg = {};
                qs.forEach(function (d) {
                  var v = d.data() || {};
                  if (d.id === "habits") hb = v.list || [];
                  else if (d.id.indexOf("logs_") === 0) Object.assign(lg, v.days || {});
                });
                S.habits = hb;
                S.logs = lg;
                render();
              },
              function () {
                toast("Sync error. Reload the page.");
              }
            )
          );

          unsubs.push(
            fs.collection("shares")
              .where("fromUid", "==", uid)
              .onSnapshot(
                function (qs) {
                  var shared = {};
                  qs.forEach(function (doc) {
                    var v = doc.data() || {};
                    shared[v.habitId] = v.doneDays || [];
                  });
                  S.ownerSharedDone = shared;
                  render();
                },
                function () {
                  toast("Sync error. Reload the page.");
                }
              )
          );

          unsubs.push(
            fs.collection("shares")
              .where("toEmail", "==", me.email.toLowerCase())
              .onSnapshot(
                function (qs) {
                  S.inbox = qs.docs.map(function (d) {
                    var v = d.data();
                    v.id = d.id;
                    return v;
                  }).filter(function (v) {
                    if (v.acceptedByUid === uid) {
                      S.sharedDone[v.id] = v.doneDays || [];
                      return false;
                    }
                    return true;
                  });
                  render();
                },
                function () {}
              )
          );
        });
      })();
    </script>
  </body>
</html>
